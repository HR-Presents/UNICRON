name: Frontend validation
on:
  push:
    branches:
      - design/hubtown-editorial-ui
      - development
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reconcile dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile to design branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/hubtown-editorial-ui'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): synchronize frontend package lock"
            git push origin HEAD:design/hubtown-editorial-ui
          fi
      - name: Install dependencies from synchronized lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
